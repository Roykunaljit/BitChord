name: My BitChord APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevBenchmark

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-unlimited-history
          path: app/build/outputs/apk/dev/benchmark/*universal*.apk
